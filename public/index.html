<!doctype html>
<html lang="ja" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ClaudeDeck</title>
<!-- ico の中に 16 / 32 / 48 が入っている。作り直すなら scripts\build-icons.ps1 -->
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" href="favicon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="favicon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">

  <header class="topbar">
    <!-- 狭い画面でだけ出る。一覧を手前に引き出す -->
    <button class="hamburger" id="list-toggle" type="button"
            aria-expanded="false" aria-controls="list-pane" aria-label="セッション一覧を開く">
      <span class="bars" aria-hidden="true"></span>
    </button>
    <h1>ClaudeDeck<span class="sub">セッションの状態</span></h1>
    <div class="summary" id="summary"></div>
    <div class="topbar-actions">
      <span class="live" id="live" data-live="wait">接続中</span>
      <button class="btn" id="reload" type="button">再読み込み</button>
      <button class="btn" id="theme-toggle" type="button" aria-label="配色を切り替える">配色</button>
    </div>
  </header>

  <div class="deck">
    <section class="list-pane" id="list-pane" aria-label="セッション一覧">
      <!-- role="tab" は使わない。正式なタブは矢印キーでタブ間を移動する約束が付くが、
           この下の一覧が上下キーをカードの移動に使っている。同じペインに矢印キーの
           契約を2つ置くほうが害が大きいので、押した状態は aria-pressed で表す -->
      <div class="list-tabs">
        <button class="tab" id="tab-live" type="button" aria-pressed="true">稼働中</button>
        <button class="tab" id="tab-archive" type="button" aria-pressed="false">書庫</button>
        <!-- 引き出しのときだけ出る。開いている間はハンバーガーが下に隠れるため。
             タブ行に置くのは、書庫を出しているあいだも閉じられるようにするため -->
        <button class="drawer-close" id="list-close" type="button" aria-label="一覧を閉じる">&#215;</button>
      </div>

      <div class="list-head" id="live-head">
        <label><input type="checkbox" id="only-live"> 稼働中だけ</label>
        <span id="list-count"></span>
      </div>
      <ul class="list" id="list"></ul>

      <div class="list-head archive-head" id="archive-head" hidden>
        <input class="archive-q" id="archive-q" type="search"
               placeholder="ID・置き場所で探す" aria-label="書庫を検索">
        <!-- 既定はファイルを開かない検索。タイトルまで探すのは押されたときだけ -->
        <label><input type="checkbox" id="archive-deep"> 中身も探す</label>
        <select id="archive-sort" aria-label="書庫の並び順">
          <option value="recent">新しい順</option>
          <option value="oldest">古い順</option>
          <option value="size">大きい順</option>
        </select>
        <span id="archive-count"></span>
      </div>
      <ul class="list" id="archive" hidden></ul>
    </section>

    <section class="detail-pane" id="detail" aria-label="セッションの詳細" tabindex="-1">
      <div class="detail-empty">左の一覧からセッションを選ぶと、ここに中身が出ます</div>
    </section>
  </div>

  <!-- 引き出しの背後を覆う膜。押すと閉じる -->
  <div class="scrim" id="scrim"></div>

</div>
<script src="app.js"></script>
</body>
</html>
